[project]
name = "anime-clip-studio"
version = "0.1.0"
description = "Frame-accurate clipping and frame extraction for anime episodes (mpv + ffmpeg)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8",
    "mpv>=1.0.7",
    "numpy>=2.1",
    "platformdirs>=4.3",
]

[project.scripts]
anime-clip-studio = "acs.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: integration tests that run ffmpeg on synthetic media"]
addopts = "-m 'not slow'"
